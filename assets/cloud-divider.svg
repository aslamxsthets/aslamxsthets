<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="100%" height="32">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="48%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="52%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="cSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Horizontal Divider Line -->
  <line x1="0" y1="16" x2="900" y2="16" stroke="url(#divLine)" stroke-width="1.5"/>

  <!-- Center Gear 5 Cloud & Conqueror's Haki Spark -->
  <g transform="translate(425, 6)" filter="url(#cSoft)">
    <!-- Swirling clouds -->
    <path d="M 12 14 C 6 14, 0 10, 4 4 C 8 -2, 18 -2, 22 4 C 26 0, 34 2, 36 7 C 40 4, 48 8, 44 14 Z" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="25" cy="10" r="2.5" fill="#f59e0b"/>
    <!-- Lightning zap -->
    <path d="M 23 2 L 20 8 L 26 9 L 22 18" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
